name: Build XPI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Opt into Node 24 for all JS actions in this workflow. As of mid-2026 the
# v4 actions (checkout / setup-node / upload-artifact / download-artifact)
# still ship Node 20 binaries; this env var tells the runner to execute
# them on Node 24 instead, silencing the deprecation warning and matching
# what the runner will default to from June 2026.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Build the optional Apple Intelligence helper on macOS.
  #
  # This job is intentionally NOT run on every push — macOS runners are
  # expensive, the macOS-26 SDK isn't always available on the latest hosted
  # image, and non-Apple users don't need the binary. It runs:
  #
  #   - On tag pushes (vX.Y.Z) so releases include the helper.
  #   - On manual `workflow_dispatch` runs.
  #
  # `continue-on-error: true` means a broken SDK / signing failure won't
  # gate the main .xpi build; the .xpi is still produced (without the
  # helper) and Apple users can build the helper locally from fm-helper/.
  build-helper:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # Matrix strategy with multiple runner labels: when GitHub publishes a
    # `macos-26` runner image (which has the macOS 26 SDK that
    # FoundationModels requires), this job will start succeeding on that
    # entry automatically — no workflow change needed. Until then, the
    # `macos-latest` entry runs immediately; if its current image happens
    # to gain the macOS 26 SDK first, that path wins instead.
    #
    # `fail-fast: false` + `continue-on-error: true` mean a missing-SDK
    # build failure on either entry never blocks the .xpi build job.
    # `timeout-minutes: 30` prevents an unavailable runner label from
    # queuing for hours.
    #
    # No Apple Developer ID required — we ad-hoc sign with `codesign --sign -`,
    # and the plugin's bootstrap strips com.apple.quarantine on startup so
    # the downloaded binary runs on most Macs.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-latest]
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    timeout-minutes: 30
    outputs:
      built: ${{ steps.build.outputs.built }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version || true
          swift --version

      - name: Build fm-helper
        id: build
        working-directory: fm-helper
        run: |
          set -eux
          swift build -c release --arch arm64
          BIN=".build/arm64-apple-macosx/release/fm-helper"
          file "$BIN"
          codesign --sign - --force --timestamp=none "$BIN"
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Upload helper artifact
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          # Per-runner artifact name so both matrix entries can upload
          # without colliding. The bundling step below tries each in turn.
          name: fm-helper-${{ matrix.runner }}
          path: fm-helper/.build/arm64-apple-macosx/release/fm-helper
          if-no-files-found: error
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    needs: [build-helper]
    if: always()
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run tests
        run: npm test

      # Try to grab a CI-built helper, but only if the helper job actually ran.
      # The job is gated to tags + workflow_dispatch (see build-helper above),
      # so on a normal push to main `needs.build-helper.result` will be
      # 'skipped' and we don't waste time trying to download artifacts that
      # don't exist (and don't pollute the run with red "artifact not found"
      # annotations). When it did run, prefer the macos-26 artifact (built
      # against the real macOS 26 SDK) and fall back to macos-latest.
      - name: Download helper (macos-26 if available)
        id: dl-26
        if: needs.build-helper.result == 'success' || needs.build-helper.result == 'failure'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: fm-helper-macos-26
          path: bin

      - name: Download helper (macos-latest fallback)
        if: (needs.build-helper.result == 'success' || needs.build-helper.result == 'failure') && steps.dl-26.outcome != 'success'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: fm-helper-macos-latest
          path: bin

      - name: Stage helper for bundling
        run: |
          set -eux
          if [ -f bin/fm-helper ]; then
            chmod +x bin/fm-helper
            echo "✓ fm-helper present, will be bundled into the .xpi"
          else
            echo "ℹ fm-helper not built on this run — .xpi will ship without it"
            echo "  Apple users can click 'Build helper now' in the dialog,"
            echo "  or build manually via 'cd fm-helper && swift build -c release --arch arm64'."
          fi

      - name: Read version from manifest
        id: meta
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          NAME=$(jq -r '.applications.zotero.id' manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "addon_id=$NAME" >> "$GITHUB_OUTPUT"
          echo "xpi_name=metadata-filler-$VERSION.xpi" >> "$GITHUB_OUTPUT"

      - name: Build .xpi
        run: |
          set -eux
          rm -f *.xpi
          # The .xpi is just a zip of the addon root (manifest.json must be at
          # top level). bin/ is included only if the helper was successfully
          # built by the build-helper job and downloaded into bin/fm-helper.
          BIN_ARG=""
          if [ -f bin/fm-helper ]; then BIN_ARG="bin/"; fi
          HELPER_SRC=""
          if [ -d fm-helper ]; then HELPER_SRC="fm-helper/"; fi
          zip -r "${{ steps.meta.outputs.xpi_name }}" \
            manifest.json \
            bootstrap.js \
            lib/ \
            content/ \
            locale/ \
            $BIN_ARG \
            $HELPER_SRC \
            -x "*.DS_Store" "*/.DS_Store" \
               "fm-helper/.build/*" "fm-helper/.swiftpm/*" "fm-helper/Package.resolved"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: metadata-filler-xpi
          path: ${{ steps.meta.outputs.xpi_name }}
          if-no-files-found: error

      - name: Generate update.json (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cat > update.json <<EOF
          {
            "addons": {
              "${{ steps.meta.outputs.addon_id }}": {
                "updates": [
                  {
                    "version": "${{ steps.meta.outputs.version }}",
                    "update_link": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.meta.outputs.xpi_name }}",
                    "applications": {
                      "zotero": { "strict_min_version": "6.999" }
                    }
                  }
                ]
              }
            }
          }
          EOF

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.meta.outputs.xpi_name }}
            update.json
          generate_release_notes: true
